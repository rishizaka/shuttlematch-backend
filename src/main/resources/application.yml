spring:
  application:
    name: shuttlematch

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shuttlematch}
    username: ${DB_USERNAME:shuttlematch}
    password: ${DB_PASSWORD:shuttlematch}

  jpa:
    open-in-view: false
    hibernate:
      # スキーマは Flyway で管理するため Hibernate は検証のみ
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# アプリ固有の設定
app:
  admin:
    # 運営者本人が全ルームを閲覧するための秘密(サイト全体に1本)。
    # 未設定なら管理者アクセスは無効。閲覧専用で、破壊的な操作には一切効かない。
    token: ${APP_ADMIN_TOKEN:}
  cors:
    # フロントエンドのオリジン。本番はデプロイ先ドメインを環境変数 APP_CORS_ALLOWED_ORIGINS で指定する
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  push:
    # モバイルへの Push 通知。送信先は Expo Push API で、FCM/APNs の資格情報は持たない(EAS 側)。
    # ローカル開発などで実際に飛ばしたくないときは APP_PUSH_ENABLED=false にする。
    enabled: ${APP_PUSH_ENABLED:true}
    expo-url: ${APP_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
