spring:
  application:
    name: shuttlematch

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shuttlematch}
    username: ${DB_USERNAME:shuttlematch}
    password: ${DB_PASSWORD:shuttlematch}

  jpa:
    open-in-view: false
    hibernate:
      # スキーマは Flyway で管理するため Hibernate は検証のみ
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
