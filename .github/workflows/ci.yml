name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    # main への push のときだけデプロイする(PR では走らせない)。
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # 同時デプロイで jar の差し替えが競合しないよう直列化する。
    # SecurityGroup の一時ルールが互いに干渉するのを防ぐ意味もある。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC で AWS ロールを AssumeRole するために必要
      contents: read

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Select bootJar
        run: |
          set -euo pipefail
          # plain jar(実行不可)を除いた実行可能 jar を選ぶ。
          JAR=$(ls -t artifact/*.jar | grep -v plain | head -1)
          test -n "$JAR"
          echo "Selected: $JAR ($(du -h "$JAR" | cut -f1))"
          cp "$JAR" app.jar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # EC2 の 22番は普段あなたの自宅IPにしか開いていない。
      # runner の IP を /32 で一時的に許可し、最後に必ず削除する。
      - name: Open SSH for this runner
        id: open_ssh
        env:
          EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sf --max-time 15 https://checkip.amazonaws.com | tr -d '[:space:]')
          test -n "$RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=gha-deploy-run-${GITHUB_RUN_ID}}]"
          echo "opened 22/tcp for ${RUNNER_IP}/32"

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # SG 反映直後は接続できないことがあるのでリトライする。
          for i in $(seq 1 10); do
            if ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "known_hosts registered"
              exit 0
            fi
            echo "ssh-keyscan retry $i"
            sleep 5
          done
          echo "::error::ssh-keyscan failed - EC2 に到達できません"
          exit 1

      - name: Upload jar to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key app.jar "ec2-user@$EC2_HOST:/tmp/app.jar"

      - name: Deploy and health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "ec2-user@$EC2_HOST" 'bash -eu -o pipefail -s' <<'REMOTE'
            cd ~
            # ロールバック用に現行 jar を退避してから差し替える。
            cp app.jar app.jar.bak
            mv /tmp/app.jar app.jar
            sudo systemctl restart shuttlematch

            # 起動完了まで待つ。Spring Boot の起動には数十秒かかることがある。
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost:8080/actuator/health; then
                echo "health OK (${i}0s 以内)"
                systemctl is-active shuttlematch
                exit 0
              fi
              sleep 10
            done

            # 起動しなかったら直前の jar に戻す。
            echo "::error::health check failed - rolling back"
            cp app.jar.bak app.jar
            sudo systemctl restart shuttlematch
            sleep 15
            systemctl is-active shuttlematch || true
            exit 1
          REMOTE

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://s-match.net/api/v1/rooms/__healthcheck__)
          echo "https://s-match.net/api/* -> HTTP $code"
          # backend まで到達していれば 4xx が返る(5xx や 000 は異常)。
          case "$code" in
            4*) echo "backend reachable via CloudFront" ;;
            *)  echo "::error::unexpected status $code"; exit 1 ;;
          esac

      # 成否にかかわらず一時ルールを必ず閉じる。
      - name: Close SSH
        if: always() && steps.open_ssh.outputs.runner_ip != ''
        env:
          EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
          RUNNER_IP: ${{ steps.open_ssh.outputs.runner_ip }}
        run: |
          set -euo pipefail
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]"
          echo "closed 22/tcp for ${RUNNER_IP}/32"
          # 取り残しがないか確認する(あれば警告として可視化)。
          aws ec2 describe-security-groups --group-ids "$EC2_SG_ID" \
            --query "SecurityGroups[].IpPermissions[?FromPort==\`22\`].IpRanges[]" --output json

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
